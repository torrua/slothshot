services:
  - type: web
    name: slothshot
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt && python examples/generate_samples.py data/screenshots"
    startCommand: "uvicorn slothshot.web.app:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.0
      - key: ENVIRONMENT
        value: production
      - key: SENTRY_DSN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: TABPFN_TOKEN
        sync: false
